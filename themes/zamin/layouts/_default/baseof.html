<!doctype html>
<html lang="{{ .Site.LanguageCode | default "en" }}" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
{{ partial "head-seo.html" . }}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/theme.css" | relURL }}">
</head>
<body>

<div class="progress" id="progress"></div>

<div class="wrap">

  <header class="site">
    <div class="bar">
      <a href="{{ "/" | relURL }}" class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span>{{ .Site.Title }}</span>
      </a>
      <nav class="main">
        {{- $cur := . -}}
        {{- range .Site.Menus.main -}}
          <a href="{{ .URL | relURL }}" class="nav-link{{ if or (eq $cur.RelPermalink (.URL | relURL)) (and (eq .URL "/") $cur.IsHome) }} active{{ end }}">{{ .Name | lower }}</a>
        {{- end -}}
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" id="themeIcon">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site">
    <span>© {{ now.Format "2006" }} {{ .Site.Title }}</span>
    <span>set in MellSans</span>
  </footer>
</div>

<div class="tweaks-panel" id="tweaksPanel">
  <div class="t-title">Tweaks</div>
  <div class="row">
    <label for="sizeCtrl">Font size</label>
    <div class="size-controls" id="sizeCtrl">
      <button class="size-btn" data-size="15">A</button>
      <button class="size-btn" data-size="17">A</button>
      <button class="size-btn" data-size="19">A</button>
      <button class="size-btn" data-size="21">A</button>
    </div>
  </div>
</div>

<script src="{{ "js/theme.js" | relURL }}"></script>
</body>
</html>
