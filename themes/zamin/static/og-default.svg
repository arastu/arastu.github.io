<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#A8C4B0" opacity="0.35"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4F7F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F4F7F4" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- paper background -->
  <rect width="1200" height="630" fill="#F4F7F4"/>

  <!-- dotted texture, faded toward the right where the type sits -->
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#fade)"/>

  <!-- left accent band: stripes -->
  <g opacity="0.55">
    <rect x="84" y="120" width="6" height="390" fill="#6E8B70"/>
    <rect x="100" y="120" width="2" height="390" fill="#A8C4B0"/>
    <rect x="110" y="120" width="2" height="390" fill="#A8C4B0"/>
  </g>

  <!-- mark dot, like the site's brand mark -->
  <circle cx="160" cy="142" r="7" fill="#6E8B70"/>

  <!-- kicker -->
  <text x="186" y="148"
        font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="20" letter-spacing="2" fill="#5A6355">FIELD NOTES</text>

  <!-- title -->
  <text x="160" y="290"
        font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="120" font-weight="500" fill="#2A3028">arastu.io</text>

  <!-- horizontal rule -->
  <rect x="160" y="332" width="80" height="3" fill="#6E8B70"/>

  <!-- dek line 1 -->
  <text x="160" y="402"
        font-family="ui-serif, 'Iowan Old Style', Georgia, serif"
        font-style="italic" font-size="40" fill="#2A3028">on the edges of systems —</text>

  <!-- dek line 2 -->
  <text x="160" y="452"
        font-family="ui-serif, 'Iowan Old Style', Georgia, serif"
        font-size="32" fill="#5A6355">postgres, distributed work, and the grain of debugging.</text>

  <!-- footer rule -->
  <rect x="84" y="554" width="1032" height="1" fill="#D8DFD4"/>

  <!-- footer left -->
  <text x="84" y="588"
        font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="18" fill="#8A948A">a quiet log · since 2022</text>

  <!-- footer right -->
  <text x="1116" y="588" text-anchor="end"
        font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="18" fill="#8A948A">arastu.io</text>
</svg>
